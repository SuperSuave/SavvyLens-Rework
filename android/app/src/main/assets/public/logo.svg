<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <filter id="sShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feOffset dy="1.8" result="offsetBlur"/>
      <feFlood flood-color="#070711" flood-opacity=".75" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="1.55" result="softGlow"/>
      <feFlood flood-color="#02C8D7" flood-opacity=".52" result="glowColor"/>
      <feComposite in="glowColor" in2="softGlow" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="peripheralSoft" x="-18%" y="-25%" width="136%" height="150%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
    <linearGradient id="sFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29283e"/>
      <stop offset="1" stop-color="#151421"/>
    </linearGradient>
  </defs>
  <title id="title">SavvyLens full logo with depth and signal focus</title>
  <desc id="desc">The original SavvyLens logo with softly defocused peripheral CAN waves and a crisp cyan center signal.</desc>
